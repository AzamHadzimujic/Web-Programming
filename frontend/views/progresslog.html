<div class="view-body">
  <section class="page progresslog">
    <div class="page-header">
      <h1>Progress Log</h1>
      <p>Update your weight and body fat. The system updates only if values changed.</p>
    </div>

    <div class="activity-form-container">
      <h2>Update Progress</h2>
      <form id="progresslog-form" class="activity-form">
        <div class="form-group">
          <label>Weight (kg):</label>
          <input type="number" id="pl-weight" min="0" max="500" required />
        </div>

        <div class="form-group">
          <label>Body Fat (%):</label>
          <input type="number" id="pl-bodyfat" min="0" max="100" required />
        </div>

        <button type="submit" class="btn-primary">Save</button>
      </form>
    </div>

    <div style="margin-top:16px;">
      <h2>Current Saved Values</h2>
      <p><strong>Weight:</strong> <span id="pl-current-weight">-</span></p>
      <p><strong>Body Fat:</strong> <span id="pl-current-bodyfat">-</span></p>
      <p><strong>Status:</strong> <span id="pl-status">-</span></p>
    </div>
  </section>
</div>
